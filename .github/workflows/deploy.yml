  name: Deploy to Production

  on:
    push:
      branches: [main]
    workflow_dispatch:

  jobs:
    deploy:
      name: 部署到生产服务器
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
        - name: SSH 执行服务器部署脚本
          env:
            JUSTONE_API_TOKEN: ${{ secrets.JUSTONE_API_TOKEN }}
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.VEYASHIP_HOST }}
            username: root
            key: ${{ secrets.VEYASHIP_SSH_KEY }}
            envs: JUSTONE_API_TOKEN
            script: |
              set -e
              COMPOSE_FILE=$(find /opt/veyaship -maxdepth 4 -name docker-compose.prod.yml -print -quit)
              if [ -z "$COMPOSE_FILE" ]; then
                echo "未找到生产 docker-compose.prod.yml，终止部署"
                exit 1
              fi
              PROJECT_DIR=$(dirname "$COMPOSE_FILE")
              ENV_FILE="$PROJECT_DIR/.env"
              echo "生产项目目录：$PROJECT_DIR"
              touch "$ENV_FILE"
              if [ -z "${JUSTONE_API_TOKEN:-}" ]; then
                echo "缺少 JUSTONE_API_TOKEN Secret，终止部署"
                exit 1
              fi
              if grep -q '^JUSTONE_API_TOKEN=' "$ENV_FILE"; then
                sed -i "s|^JUSTONE_API_TOKEN=.*|JUSTONE_API_TOKEN=${JUSTONE_API_TOKEN}|" "$ENV_FILE"
              else
                printf '\nJUSTONE_API_TOKEN=%s\n' "$JUSTONE_API_TOKEN" >> "$ENV_FILE"
              fi
              if ! grep -Eq '^JUSTONE_API_TOKEN=.+$' "$ENV_FILE"; then
                echo "Just One API Token 写入服务器环境失败，终止部署"
                exit 1
              fi
              echo "Just One API 凭据已注入服务器环境"
              bash /opt/veyaship/cicd-deploy.sh
              cd "$PROJECT_DIR"
              if docker compose -f "$COMPOSE_FILE" exec -T backend \
                python -c "from app.core.config import settings; raise SystemExit(0 if settings.JUSTONE_API_TOKEN else 1)"; then
                echo "Just One API 运行时配置检查通过"
              else
                echo "Just One API 运行时配置未加载，终止部署"
                exit 1
              fi
