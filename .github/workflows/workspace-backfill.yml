name: Workspace Data Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 只检查；apply 会先备份并在 unresolved=0 后写库"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
          - verify
      email:
        description: "verify 模式下只读检查的账号邮箱"
        required: false
        default: "admin@veyaship.com"
        type: string

concurrency:
  group: workspace-backfill-production
  cancel-in-progress: false

jobs:
  backfill:
    name: Production workspace backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup, audit, and optionally apply
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
          VERIFY_EMAIL: ${{ inputs.email }}
        with:
          host: ${{ secrets.VEYASHIP_HOST }}
          username: root
          key: ${{ secrets.VEYASHIP_SSH_KEY }}
          envs: BACKFILL_MODE,VERIFY_EMAIL
          command_timeout: 25m
          script: |
            set -euo pipefail

            PROJECT_DIR=/opt/veyaship/crossborder-ai
            BACKEND_DIR="$PROJECT_DIR/backend"
            if [ ! -x "$BACKEND_DIR/venv/bin/python" ]; then
              echo "未找到生产后端虚拟环境"
              exit 1
            fi

            if [ "$BACKFILL_MODE" = "verify" ]; then
              cd "$BACKEND_DIR"
              ./venv/bin/python - "$VERIFY_EMAIL" <<'PY'
            import asyncio
            import json
            import sys

            from sqlalchemy import func, select

            from app.core.database import async_session_factory
            from app.models.agent_task import AgentTask
            from app.models.image_asset import ImageAsset
            from app.models.listing_draft import ListingDraft
            from app.models.product import Product
            from app.models.shopify_channel import ShopifyChannel
            from app.models.user import User
            from app.models.video_generation_task import VideoGenerationTask
            from app.models.workspace import Workspace


            async def main(email: str) -> int:
                async with async_session_factory() as db:
                    user = (
                        await db.execute(
                            select(User).where(
                                func.lower(User.email) == email.lower(),
                                User.deleted_at.is_(None),
                            )
                        )
                    ).scalar_one_or_none()
                    if user is None:
                        print(json.dumps({"status": "user_not_found"}))
                        return 1
                    workspace = (
                        await db.execute(
                            select(Workspace).where(
                                Workspace.owner_user_id == user.id,
                                Workspace.type == "personal",
                                Workspace.status == "active",
                            )
                        )
                    ).scalar_one_or_none()
                    if workspace is None:
                        print(json.dumps({"status": "personal_workspace_missing"}))
                        return 1

                    checks = {}
                    models = {
                        "products": (Product, Product.user_id),
                        "image_assets": (ImageAsset, ImageAsset.user_id),
                        "agent_tasks": (AgentTask, AgentTask.user_id),
                        "video_generation_tasks": (
                            VideoGenerationTask,
                            VideoGenerationTask.user_id,
                        ),
                        "listing_drafts": (ListingDraft, ListingDraft.user_id),
                    }
                    for name, (model, owner_column) in models.items():
                        restored = await db.scalar(
                            select(func.count())
                            .select_from(model)
                            .where(
                                owner_column == user.id,
                                model.workspace_id == workspace.id,
                            )
                        )
                        legacy = await db.scalar(
                            select(func.count())
                            .select_from(model)
                            .where(
                                owner_column == user.id,
                                model.workspace_id.is_(None),
                            )
                        )
                        checks[name] = {
                            "restored": int(restored or 0),
                            "legacy_hidden": int(legacy or 0),
                        }

                    restored_channels = await db.scalar(
                        select(func.count())
                        .select_from(ShopifyChannel)
                        .where(
                            ShopifyChannel.user_id == user.id,
                            ShopifyChannel.workspace_id == workspace.id,
                            ShopifyChannel.is_active.is_(True),
                        )
                    )
                    legacy_channels = await db.scalar(
                        select(func.count())
                        .select_from(ShopifyChannel)
                        .where(
                            ShopifyChannel.user_id == user.id,
                            ShopifyChannel.workspace_id.is_(None),
                        )
                    )
                    payload = {
                        "status": (
                            "ok"
                            if int(restored_channels or 0) > 0
                            and int(legacy_channels or 0) == 0
                            else "needs_attention"
                        ),
                        "shopify_channels": {
                            "restored": int(restored_channels or 0),
                            "legacy_hidden": int(legacy_channels or 0),
                        },
                        "records": checks,
                    }
                    print(json.dumps(payload, ensure_ascii=False, indent=2))
                    return 0 if payload["status"] == "ok" else 2


            raise SystemExit(asyncio.run(main(sys.argv[1])))
            PY
              exit $?
            fi

            BACKUP_DIR=/var/backups/veyaship/workspace-backfill
            mkdir -p "$BACKUP_DIR"

            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BACKUP_FILE="$BACKUP_DIR/crossborder_ai_${STAMP}.dump"
            LATEST_BACKUP="$BACKUP_DIR/crossborder_ai_latest.dump"
            DRY_RUN_FILE="$BACKUP_DIR/dry-run-${STAMP}.json"
            APPLY_FILE="$BACKUP_DIR/apply-${STAMP}.json"
            POST_CHECK_FILE="$BACKUP_DIR/post-check-${STAMP}.json"

            cd "$BACKEND_DIR"
            DATABASE_URL=$(
              ./venv/bin/python - <<'PY'
            from app.core.config import settings

            print(
                str(settings.DATABASE_URL).replace(
                    "postgresql+asyncpg://",
                    "postgresql://",
                )
            )
            PY
            )
            if [ -z "$DATABASE_URL" ]; then
              echo "未读取到生产 DATABASE_URL"
              exit 1
            fi

            echo "创建生产数据库备份：$BACKUP_FILE"
            if command -v pg_dump >/dev/null 2>&1; then
              pg_dump \
                --dbname="$DATABASE_URL" \
                --format=custom \
                --no-owner \
                --no-acl \
                > "$BACKUP_FILE"
            else
              docker run --rm --network host postgres:15-alpine \
                pg_dump \
                --dbname="$DATABASE_URL" \
                --format=custom \
                --no-owner \
                --no-acl \
                > "$BACKUP_FILE"
            fi
            test -s "$BACKUP_FILE"
            cp "$BACKUP_FILE" "$LATEST_BACKUP"
            sha256sum "$BACKUP_FILE" | tee "$BACKUP_FILE.sha256"

            echo "执行工作区数据 dry-run"
            ./venv/bin/python -m scripts.backfill_workspace_scope --table all \
              | tee "$DRY_RUN_FILE"

            if grep -Eq '"unresolved": [1-9][0-9]*' "$DRY_RUN_FILE"; then
              echo "存在无法确定归属的历史记录；apply 会保留这些记录不做修改。"
            fi

            if [ "$BACKFILL_MODE" != "apply" ]; then
              echo "dry-run 完成；未写入生产数据。"
              exit 0
            fi

            echo "执行工作区数据正式回填"
            ./venv/bin/python -m scripts.backfill_workspace_scope --table all --apply \
              | tee "$APPLY_FILE"

            echo "执行回填后检查"
            ./venv/bin/python -m scripts.backfill_workspace_scope --table all \
              | tee "$POST_CHECK_FILE"

            if grep -Eq '"would_update": [1-9][0-9]*' "$POST_CHECK_FILE"; then
              echo "回填后仍有可更新记录，请检查恢复日志。"
              exit 3
            fi

            if grep -Eq '"unresolved": [1-9][0-9]*' "$POST_CHECK_FILE"; then
              echo "工作区数据回填完成；无明确所有者的历史记录已保留。"
            else
              echo "工作区数据回填完成。"
            fi
