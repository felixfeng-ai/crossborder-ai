# VeyaShip - Alembic database migration configuration
# ===================================
# Usage:
#   current version  alembic current
#   upgrade latest   alembic upgrade head
#   create migration alembic revision --autogenerate -m "description"
#   rollback one     alembic downgrade -1
#   inside Docker:   docker compose exec backend alembic upgrade head
#
# First production deployment:
#   1. Start the service (init_db creates missing tables)
#   2. alembic stamp head
#
# Changing models later:
#   1. Update models/xxx.py
#   2. alembic revision --autogenerate -m "change"
#   3. Review the generated migration
#   4. alembic upgrade head

[alembic]
script_location = migrations
sqlalchemy.url = postgresql://crossborder:change_this_password@localhost:5432/crossborder_ai

# Logging
[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
