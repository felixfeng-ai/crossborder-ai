<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Cpath d='M9 9l7 14 7-14' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VeyaShip - AI 跨境运营台：商品决策、Listing 生成、图片与视频创作、素材管理和渠道发布" />
    <meta name="theme-color" content="#0d0e0e" />
    <script>
      ;(() => {
        const key = 'veya-theme'
        const allowed = ['graphite', 'paper', 'harbor', 'system']
        let mode = 'graphite'
        try {
          const stored = window.localStorage.getItem(key)
          if (allowed.includes(stored)) mode = stored
        } catch {}
        const resolved =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'graphite'
              : 'paper'
            : mode
        const root = document.documentElement
        root.dataset.theme = resolved
        root.dataset.themeMode = mode
        root.classList.toggle('dark', resolved === 'graphite')
        root.style.colorScheme = resolved === 'graphite' ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', resolved === 'graphite' ? '#0d0e0e' : '#ffffff')
      })()
    </script>
    <link rel="preload" href="/fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>VeyaShip · AI 跨境运营台</title>
    <style>
      html {
        --boot-ground: #0d0e0e;
        --boot-panel: #151615;
        --boot-ink: #b4b0a8;
        --boot-line: rgba(243, 242, 237, 0.12);
        --boot-accent: #d8b56d;
      }
      html[data-theme="paper"] {
        --boot-ground: #ffffff;
        --boot-panel: #f7f7f4;
        --boot-ink: #5f615b;
        --boot-line: #e2e3de;
        --boot-accent: #9a6918;
      }
      html[data-theme="harbor"] {
        --boot-ground: #f2f7f7;
        --boot-panel: #ffffff;
        --boot-ink: #536a6d;
        --boot-line: #d7e3e3;
        --boot-accent: #16696c;
      }
      .app-boot-shell {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        background: var(--boot-ground);
        color: var(--boot-ink);
        font: 13px/1.5 "Inter", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
      }
      .app-boot-card {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--boot-line);
        background: var(--boot-panel);
        padding: 12px 16px;
      }
      .app-boot-mark {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--boot-accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--boot-accent) 12%, transparent);
      }
    </style>
  </head>
  <body class="min-h-[100dvh] bg-background font-sans antialiased">
    <div id="root">
      <div class="app-boot-shell" data-app-boot>
        <div class="app-boot-card">
          <span class="app-boot-mark" aria-hidden="true"></span>
          <span>VeyaShip 正在加载工作区…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
