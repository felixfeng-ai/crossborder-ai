name: Workspace Data Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 只检查；apply 会先备份并在 unresolved=0 后写库"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

concurrency:
  group: workspace-backfill-production
  cancel-in-progress: false

jobs:
  backfill:
    name: Production workspace backfill
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Backup, audit, and optionally apply
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKFILL_MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.VEYASHIP_HOST }}
          username: root
          key: ${{ secrets.VEYASHIP_SSH_KEY }}
          envs: BACKFILL_MODE
          command_timeout: 25m
          script: |
            set -euo pipefail

            PROJECT_DIR=/opt/veyaship/crossborder-ai
            BACKEND_DIR="$PROJECT_DIR/backend"
            if [ ! -x "$BACKEND_DIR/venv/bin/python" ]; then
              echo "未找到生产后端虚拟环境"
              exit 1
            fi
            BACKUP_DIR=/var/backups/veyaship/workspace-backfill
            mkdir -p "$BACKUP_DIR"

            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BACKUP_FILE="$BACKUP_DIR/crossborder_ai_${STAMP}.dump"
            LATEST_BACKUP="$BACKUP_DIR/crossborder_ai_latest.dump"
            DRY_RUN_FILE="$BACKUP_DIR/dry-run-${STAMP}.json"
            APPLY_FILE="$BACKUP_DIR/apply-${STAMP}.json"
            POST_CHECK_FILE="$BACKUP_DIR/post-check-${STAMP}.json"

            cd "$BACKEND_DIR"
            DATABASE_URL=$(
              ./venv/bin/python - <<'PY'
            from app.core.config import settings

            print(
                str(settings.DATABASE_URL).replace(
                    "postgresql+asyncpg://",
                    "postgresql://",
                )
            )
            PY
            )
            if [ -z "$DATABASE_URL" ]; then
              echo "未读取到生产 DATABASE_URL"
              exit 1
            fi

            echo "创建生产数据库备份：$BACKUP_FILE"
            if command -v pg_dump >/dev/null 2>&1; then
              pg_dump \
                --dbname="$DATABASE_URL" \
                --format=custom \
                --no-owner \
                --no-acl \
                > "$BACKUP_FILE"
            else
              docker run --rm --network host postgres:15-alpine \
                pg_dump \
                --dbname="$DATABASE_URL" \
                --format=custom \
                --no-owner \
                --no-acl \
                > "$BACKUP_FILE"
            fi
            test -s "$BACKUP_FILE"
            cp "$BACKUP_FILE" "$LATEST_BACKUP"
            sha256sum "$BACKUP_FILE" | tee "$BACKUP_FILE.sha256"

            echo "执行工作区数据 dry-run"
            ./venv/bin/python -m scripts.backfill_workspace_scope --table all \
              | tee "$DRY_RUN_FILE"

            if grep -Eq '"unresolved": [1-9][0-9]*' "$DRY_RUN_FILE"; then
              echo "dry-run 存在无法归属的数据，禁止执行 apply。"
              exit 2
            fi

            if [ "$BACKFILL_MODE" != "apply" ]; then
              echo "dry-run 完成；未写入生产数据。"
              exit 0
            fi

            echo "执行工作区数据正式回填"
            ./venv/bin/python -m scripts.backfill_workspace_scope --table all --apply \
              | tee "$APPLY_FILE"

            echo "执行回填后检查"
            ./venv/bin/python -m scripts.backfill_workspace_scope --table all \
              | tee "$POST_CHECK_FILE"

            if grep -Eq '"would_update": [1-9][0-9]*|"unresolved": [1-9][0-9]*' "$POST_CHECK_FILE"; then
              echo "回填后仍有待处理记录，请检查恢复日志。"
              exit 3
            fi

            echo "工作区数据回填完成。"
